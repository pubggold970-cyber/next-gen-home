<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>REALISTIC HOME CRAFT — Next Gen Home</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101820;color:#fff;font:15px system-ui,Arial;overflow:hidden}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;z-index:3;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{background:#101820d9;border:1px solid #ffffff30;border-radius:14px;padding:9px 12px;backdrop-filter:blur(8px);font-weight:650}.panel{position:fixed;z-index:4;right:12px;top:64px;width:min(230px,48vw);background:#111d27eF;border:1px solid #ffffff30;border-radius:16px;padding:12px;max-height:68vh;overflow:auto}.panel h3{margin:0 0 8px;font-size:14px;color:#9fe3ff}.panel button,.bottom button{width:100%;border:0;border-radius:11px;padding:11px 9px;margin:4px 0;background:#24465b;color:white;font-weight:700;font-size:13px}.panel button:active,.bottom button:active{background:#32789c}.panel .active{background:#087e91}.bottom{position:fixed;z-index:4;bottom:12px;left:12px;right:12px;display:flex;gap:7px;align-items:end}.bottom button{flex:1;margin:0;background:#17384a;min-height:48px}.bottom button.primary{background:#087e91}.hint{position:fixed;z-index:3;bottom:74px;left:50%;transform:translateX(-50%);background:#111d27d9;padding:8px 12px;border-radius:12px;font-size:12px;white-space:nowrap;color:#d6e8f2}.hidden{display:none!important}
@media(max-width:520px){.panel{top:60px;width:164px;padding:8px}.panel button{padding:9px 5px;font-size:12px}.pill{font-size:12px;padding:8px}.hint{font-size:10px;bottom:70px}}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud"><div class="pill">🏡 REALISTIC HOME CRAFT</div><div class="pill" id="mode">Explore Mode</div></div>
<aside class="panel" id="panel"><h3>BUILD MENU</h3>
<button data-item="sofa">🛋️ Modern Sofa</button><button data-item="bed">🛏️ Luxury Bed</button><button data-item="table">🪑 Coffee Table</button><button data-item="plant">🪴 Indoor Plant</button><button data-item="lamp">💡 Floor Lamp</button><button data-item="tv">📺 Smart TV</button>
<hr style="border-color:#ffffff20"><button id="wall">🎨 Change Wall Color</button><button id="save">💾 Save My Home</button><button id="reset">↻ Reset Room</button>
</aside>
<div class="hint" id="hint">Drag to look around • Tap BUILD to place furniture</div>
<div class="bottom"><button id="explore">Explore</button><button id="build" class="primary">Build</button><button id="rotate">Rotate Item</button><button id="delete">Remove Last</button></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const root=document.getElementById('game'), panel=document.getElementById('panel'), modeLabel=document.getElementById('mode'), hint=document.getElementById('hint');
if(!window.THREE){hint.textContent='3D engine could not load. Check your internet connection and refresh.';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bb6c7);scene.fog=new THREE.Fog(0x9bb6c7,18,42);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);camera.position.set(7,6,9);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf6ff,0x59616b,2));
const sun=new THREE.DirectionalLight(0xffedcf,2.2);sun.position.set(-5,10,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.75)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const floorMat=mat(0x9b8068), wallMat=mat(0xe4e1d9), wood=mat(0x68452f), dark=mat(0x202b35), fabric=mat(0x477c91), gold=mat(0xc49a55), green=mat(0x39734d);
function box(w,h,d,m,x,y,z,group=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;group.add(o);return o}
const floor=box(12,.25,10,floorMat,0,-.13,0);const walls=new THREE.Group();scene.add(walls);
box(12,3,.2,wallMat,0,1.35,-5,walls);box(.2,3,10,wallMat,-6,1.35,0,walls);box(.2,3,10,wallMat,6,1.35,0,walls);
box(12,.12,.22,wood,0,.12,-4.86,walls);box(.22,.12,10,wood,-5.86,.12,0,walls);
const windowMat=new THREE.MeshStandardMaterial({color:0x91cbe4,metalness:.2,roughness:.15});
box(2.3,1.4,.08,windowMat,-2.7,2.0,-4.86,walls);box(.08,1.5,.1,wood,-2.7,2,-4.78,walls);box(2.4,.08,.1,wood,-2.7,2,-4.78,walls);
const rug=box(4,.05,3,mat(0x344e5b),0,.03,1.2);
let yaw=Math.PI/4,pitch=.35,target=new THREE.Vector3(0,1,0),distance=13,buildMode=false,selected='sofa',rotation=0,items=[],last=null,wallColor=0xe4e1d9;
function furniture(type,x=0,z=0,rot=0){
 const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);
 const add=(w,h,d,m,px,py,pz)=>box(w,h,d,m,px,py,pz,g);
 if(type==='sofa'){add(2.5,.55,.9,fabric,0,.55,0);add(2.5,.9,.22,fabric,0,1.15,-.36);add(.22,.7,.9,fabric,-1.14,.9,0);add(.22,.7,.9,fabric,1.14,.9,0);for(let a of [-.9,.9])for(let b of [-.3,.3])add(.12,.35,.12,dark,a,.18,b)}
 if(type==='bed'){add(2.5,.35,3,wood,0,.35,0);add(2.35,.22,2.8,mat(0xe6e2d9),0,.62,.05);add(2.5,.85,.18,wood,0,.8,-1.45);add(.85,.22,.65,mat(0xf5f1e8),-.6,.85,-.8);add(.85,.22,.65,mat(0xf5f1e8),.6,.85,-.8)}
 if(type==='table'){add(1.7,.14,1.1,wood,0,.85,0);for(let x1 of [-.7,.7])for(let z1 of [-.4,.4])add(.12,.8,.12,dark,x1,.4,z1)}
 if(type==='plant'){add(.65,.55,.65,mat(0x9b5938),0,.28,0);for(let i=0;i<7;i++){let leaf=new THREE.Mesh(new THREE.SphereGeometry(.27,12,10),green);leaf.position.set(Math.sin(i)*.3,.9+Math.cos(i*2)*.15,Math.cos(i)*.3);leaf.scale.set(.65,1.5,.65);g.add(leaf)}}
 if(type==='lamp'){add(.12,1.8,.12,gold,0,.9,0);let shade=new THREE.Mesh(new THREE.ConeGeometry(.45,.45,20,1,true),gold);shade.position.y=1.95;g.add(shade);add(.6,.08,.6,dark,0,.05,0)}
 if(type==='tv'){add(2.1,1.2,.12,dark,0,1.5,0);add(1.95,1.05,.025,mat(0x101d2c,.2),0,1.5,.08);add(.12,.5,.12,dark,0,.65,0);add(1,.1,.5,wood,0,.3,0)}
 items.push({type,g});last=g;return g;
}
function setMode(v){buildMode=v;modeLabel.textContent=v?'Build Mode':'Explore Mode';panel.classList.toggle('hidden',!v);hint.textContent=v?'Choose furniture, then tap the floor to place it':'Drag to look around • Use Explore to view your home';}
document.getElementById('build').onclick=()=>setMode(true);document.getElementById('explore').onclick=()=>setMode(false);
panel.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{selected=b.dataset.item;panel.querySelectorAll('[data-item]').forEach(x=>x.classList.toggle('active',x===b));hint.textContent='Selected '+selected+' • Tap floor to place'});
document.getElementById('rotate').onclick=()=>{rotation+=Math.PI/4;hint.textContent='Next furniture rotation: '+Math.round(rotation*180/Math.PI)+'°'};
document.getElementById('delete').onclick=()=>{if(last){scene.remove(last);items=items.filter(i=>i.g!==last);last=items.length?items[items.length-1].g:null}};
document.getElementById('wall').onclick=()=>{const colors=[0xe4e1d9,0xd6e4e8,0xe7d7c6,0xc9d5c8,0xd8d0e6];wallColor=colors[(colors.indexOf(wallColor)+1)%colors.length];walls.children.forEach(o=>{if(o.material===wallMat)o.material=mat(wallColor)})};
document.getElementById('save').onclick=()=>{const data=items.map(i=>({type:i.type,x:i.g.position.x,z:i.g.position.z,rot:i.g.rotation.y}));localStorage.setItem('rhcraft-home',JSON.stringify({data,wallColor}));hint.textContent='Home saved on this device ✓'};
document.getElementById('reset').onclick=()=>{items.forEach(i=>scene.remove(i.g));items=[];last=null;localStorage.removeItem('rhcraft-home');hint.textContent='Room reset'};
try{const saved=JSON.parse(localStorage.getItem('rhcraft-home')||'null');if(saved){if(saved.data)saved.data.forEach(i=>furniture(i.type,i.x,i.z,i.rot));}}catch(e){}
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{if(!buildMode)return;const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(pointer,camera);const hit=ray.intersectObject(floor);if(hit.length){const p=hit[0].point;if(Math.abs(p.x)<5&&p.z>-4.5&&p.z<4.5)furniture(selected,p.x,p.z,rotation)}});
let down=false,px=0,py=0;renderer.domElement.addEventListener('pointerdown',e=>{down=true;px=e.clientX;py=e.clientY});addEventListener('pointerup',()=>down=false);renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;yaw-=dx*.006;pitch=Math.max(.08,Math.min(.9,pitch+dy*.004))});
function animate(){requestAnimationFrame(animate);camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*distance,target.y+Math.sin(pitch)*distance,target.z+Math.cos(yaw)*Math.cos(pitch)*distance);camera.lookAt(target);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
