<!doctype html>
<html lang="en">
<head>

.movePad{position:fixed;z-index:5;left:14px;bottom:82px;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:44px 44px;gap:4px}

.movePad button[data-move="forward"]{grid-column:2;grid-row:1}.movePad button[data-move="left"]{grid-column:1;grid-row:2}.movePad button[data-move="back"]{grid-column:2;grid-row:2}.movePad button[data-move="right"]{grid-column:3;grid-row:2}#jumpBtn{grid-column:1;grid-row:1;background:#17634f;font-size:12px}.movePad #sprintBtn{grid-column:3;grid-row:1;background:#79521bd9;font-size:12px}
@media(max-width:520px){.movePad{bottom:78px;grid-template-columns:42px 42px 42px;grid-template-rows:40px 40px}.movePad button{font-size:16px}}
@media(max-width:520px){.panel{top:60px;width:164px;padding:8px}.panel button{padding:9px 5px;font-size:12px}.pill{font-size:12px;padding:8px}.hint{font-size:10px;bottom:70px}}

</head>
<body>
<div id="game"></div>
<div class="hud"><div class="pill">🏡 REALISTIC HOME CRAFT · SINGLE PLAYER</div><div class="pill" id="mode">Explore Mode</div></div>
<aside class="panel" id="panel"><h3>BUILD MENU</h3>
<button data-item="sofa">🛋️ Modern Sofa</button><button data-item="bed">🛏️ Luxury Bed</button><button data-item="table">🪑 Coffee Table</button><button data-item="plant">🪴 Indoor Plant</button><button data-item="lamp">💡 Floor Lamp</button><button data-item="tv">📺 Smart TV</button><button data-item="kitchen">🍳 Kitchen Counter</button><button data-item="bath">🛁 Bathroom Set</button><button data-item="garage">🚗 Garage</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const root=document.getElementById('game'), panel=document.getElementById('panel'), modeLabel=document.getElementById('mode'), hint=document.getElementById('hint');
if(!window.THREE){hint.textContent='3D engine could not load. Check your internet connection and refresh.';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bb6c7);scene.fog=new THREE.Fog(0x9bb6c7,18,42);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);camera.position.set(7,6,9);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf6ff,0x59616b,2));
const sun=new THREE.DirectionalLight(0xffedcf,2.2);sun.position.set(-5,10,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.75)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const floorMat=mat(0x9b8068), wallMat=mat(0xe4e1d9), wood=mat(0x68452f), dark=mat(0x202b35), fabric=mat(0x477c91), gold=mat(0xc49a55), green=mat(0x39734d);
function box(w,h,d,m,x,y,z,group=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;group.add(o);return o}
const floor=box(12,.25,10,floorMat,0,-.13,0);const walls=new THREE.Group();scene.add(walls);
const paintableWalls=[box(12,3,.2,wallMat,0,1.35,-5,walls),box(.2,3,10,wallMat,-6,1.35,0,walls),box(.2,3,10,wallMat,6,1.35,0,walls)];
box(12,.12,.22,wood,0,.12,-4.86,walls);box(.22,.12,10,wood,-5.86,.12,0,walls);
box(.22,.12,10,wood,-5.86,.12,0,walls);
// Interior partition creates a separate bedroom and a wide central doorway
const partitionMat=mat(0xd9d5cc), doorWood=mat(0x704b32);
box(4.25,2.8,.16,partitionMat,-3.875,1.4,-.7,walls);
box(4.25,2.8,.16,partitionMat,3.875,1.4,-.7,walls);
box(3.5,.25,.2,partitionMat,0,2.925,-.7,walls);
// Hinged door in the central opening; press E or tap the door control nearby
const doorPivot=new THREE.Group();doorPivot.position.set(-1.15,0,-.7);scene.add(doorPivot);
const doorPanel=box(2.25,2.55,.12,doorWood,1.125,1.275,0,doorPivot);
box(.12,.18,.08,gold,2.02,1.25,.1,doorPivot);
let doorOpen=false;
function toggleDoor(){const near=Math.hypot(player.position.x+1.15,player.position.z+.7);if(near>2.8){hint.textContent='Door de kol jaan layi usde nere jao';return}doorOpen=!doorOpen;doorPivot.rotation.y=doorOpen?-Math.PI/2:0;hint.textContent=doorOpen?'Bedroom door opened':'Bedroom door closed'}

const windowMat=new THREE.MeshStandardMaterial({color:0x91cbe4,metalness:.2,roughness:.15});
box(2.3,1.4,.08,windowMat,-2.7,2.0,-4.86,walls);box(.08,1.5,.1,wood,-2.7,2,-4.78,walls);box(2.4,.08,.1,wood,-2.7,2,-4.78,walls);
// Dedicated room partitions for kitchen, bathroom and garage
const roomWall=mat(0xd3d0c8);
function partition(w,h,d,x,y,z){return box(w,h,d,roomWall,x,y,z,walls)}
partition(.16,2.8,1.45,0,1.4,-4.05);partition(.16,2.8,1.45,0,1.4,-1.55);
partition(.16,2.8,1.55,1.95,1.4,1.15);partition(.16,2.8,1.55,1.95,1.4,3.95);
partition(1.15,2.8,.16,2.65,1.4,4.35);partition(1.15,2.8,.16,5.15,1.4,4.35);partition(1.25,.35,.16,3.9,2.62,4.35);
function floorLabel(text,x,z,color){const cv=document.createElement('canvas');cv.width=512;cv.height=128;const ctx=cv.getContext('2d');ctx.fillStyle=color;ctx.font='bold 52px Arial';ctx.textAlign='center';ctx.fillText(text,256,78);const tex=new THREE.CanvasTexture(cv);const m=new THREE.Mesh(new THREE.PlaneGeometry(2.2,.55),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.set(x,.015,z);scene.add(m)}
floorLabel('KITCHEN',-3.7,-4.25,'#fff4d8');floorLabel('BATHROOM',3.7,-4.25,'#e8fbff');floorLabel('GARAGE',3.9,3.8,'#ffffff');
const rug=box(4,.05,3,mat(0x344e5b),0,.03,1.2);
// Outdoor grounds, garden, walkway and trees around the home
const lawnMat=mat(0x47734c), pathMat=mat(0xb8aa91), trunkMat=mat(0x60432d);
box(80,.18,80,lawnMat,0,-.38,0);
box(3,.06,14,pathMat,8,-.27,2);
function tree(x,z){box(.35,2,.35,trunkMat,x,.65,z);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.05,14,12),green);crown.position.set(x,2.15,z);crown.castShadow=true;scene.add(crown)}
tree(-10,-7);tree(-12,3);tree(10,-8);tree(12,4);tree(-8,10);tree(9,11);
for(let x=-8;x<=8;x+=2)box(.12,.65,.12,wood,x,-.02,-8);

let yaw=Math.PI/4,pitch=.28,yawTarget=Math.PI/4,pitchTarget=.28,target=new THREE.Vector3(0,1,0),distance=8,buildMode=false,selected='sofa',rotation=0,items=[],last=null,wallColor=0xe4e1d9;
const playerVelocity=new THREE.Vector2();
// Simple third-person avatar; movement is controlled by the on-screen pad or keyboard
const player=new THREE.Group();scene.add(player);
const body=new THREE.Mesh(new THREE.CylinderGeometry(.25,.32,.95,12),mat(0x246b9a));body.position.y=.78;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.23,16,12),mat(0xd6a47c));head.position.y=1.42;head.castShadow=true;player.add(head);
const legMat=mat(0x202c3a),legs=[];
for(const x of [-.13,.13]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.09,.11,.55,10),legMat);leg.position.set(x,.27,0);player.add(leg);legs.push(leg)}
const armMat=mat(0x246b9a),arms=[];
for(const x of [-.34,.34]){const arm=new THREE.Mesh(new THREE.CylinderGeometry(.075,.09,.62,10),armMat);arm.position.set(x,.88,0);arm.rotation.z=x<0?-.16:.16;player.add(arm);arms.push(arm)}
player.position.set(0,0,1.1);
// Soft contact shadow and a light landing ring make jumping easier to read.
const jumpShadow=new THREE.Mesh(new THREE.CircleGeometry(.48,32),new THREE.MeshBasicMaterial({color:0x17232a,transparent:true,opacity:.28,depthWrite:false}));
jumpShadow.rotation.x=-Math.PI/2;jumpShadow.position.set(0,.012,0);scene.add(jumpShadow);
const landingRing=new THREE.Mesh(new THREE.RingGeometry(.22,.34,32),new THREE.MeshBasicMaterial({color:0xd9f3ff,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));
landingRing.rotation.x=-Math.PI/2;landingRing.position.y=.025;landingRing.visible=false;scene.add(landingRing);
let landingEffectTime=0;
function roomDoor(x,z,axis,width){const pivot=new THREE.Group();pivot.position.set(x,0,z);scene.add(pivot);box(axis==='z'?width:.12,2.45,axis==='z'?.12:width,doorWood,axis==='z'?width/2:0,1.225,axis==='z'?0:width/2,pivot);return {pivot,open:false,toggle(){if(Math.hypot(player.position.x-x,player.position.z-z)>3.2){hint.textContent='Darwaze de kol ja ke kholo';return}this.open=!this.open;this.pivot.rotation.y=this.open?(axis==='z'?-Math.PI/2:Math.PI/2):0;hint.textContent=this.open?'Room door opened':'Room door closed'}}}
const innerRoomDoor=roomDoor(0,-2.8,'x',1.25);const garageDoor=roomDoor(1.95,2.55,'z',1.25);
const held=new Set();let moving=false,sprinting=false,jumpVelocity=0,grounded=true;
function setMove(k,on){if(on)held.add(k);else held.delete(k)}
// Player collision map: solid wall segments leave the designed doorways clear.
const playerRadius=.28;
const solidWalls=[
 {x:-3.875,z:-.7,hx:2.125,hz:.13},{x:3.875,z:-.7,hx:2.125,hz:.13},
 {x:0,z:-4.05,hx:.13,hz:.725},{x:0,z:-1.55,hx:.13,hz:.725},
 {x:1.95,z:1.15,hx:.13,hz:.775},{x:1.95,z:3.95,hx:.13,hz:.775},
 {x:2.65,z:4.35,hx:.575,hz:.13},{x:5.15,z:4.35,hx:.575,hz:.13}
];
function furnitureBounds(){
 const bounds=[];
 for(const item of items){
  const b=new THREE.Box3().setFromObject(item.g);
  // Ignore objects that are entirely above or below the player's walking space.
  if(b.max.y>.12 && b.min.y<1.75) bounds.push(b);
 }
 return bounds;
}
function blockedByFurniture(x,z){
 const currentX=player.position.x,currentZ=player.position.z;
 for(const b of furnitureBounds()){
  const minX=b.min.x-playerRadius,maxX=b.max.x+playerRadius;
  const minZ=b.min.z-playerRadius,maxZ=b.max.z+playerRadius;
  const candidateInside=x>minX&&x<maxX&&z>minZ&&z<maxZ;
  if(!candidateInside) continue;
  const currentInside=currentX>minX&&currentX<maxX&&currentZ>minZ&&currentZ<maxZ;
  if(!currentInside) return true;
  // If a saved/placed object surrounds the player, allow movement that takes the player farther out.
  const cx=(minX+maxX)/2,cz=(minZ+maxZ)/2;
  const before=(currentX-cx)**2+(currentZ-cz)**2;
  const after=(x-cx)**2+(z-cz)**2;
  if(after<=before+1e-6) return true;
 }
 return false;
}
function blockedAt(x,z){
 if(x < -5.55 || x > 5.55 || z < -4.55 || z > 4.55) return true;
 for(const w of solidWalls) if(Math.abs(x-w.x)<w.hx+playerRadius && Math.abs(z-w.z)<w.hz+playerRadius)return true;
 if(!doorOpen && Math.abs(x-.0)<1.125+playerRadius && Math.abs(z+.7)<.12+playerRadius)return true;
 if(!innerRoomDoor.open && Math.abs(x)<.12+playerRadius && Math.abs(z+2.8)<.625+playerRadius)return true;
 if(!garageDoor.open && Math.abs(x-1.95)<.625+playerRadius && Math.abs(z-2.55)<.12+playerRadius)return true;
 if(blockedByFurniture(x,z)) return true;
 return false;
}
function movePlayer(dx,dz){
 const nx=player.position.x+dx,nz=player.position.z+dz;
 if(!blockedAt(nx,player.position.z))player.position.x=nx;
 if(!blockedAt(player.position.x,nz))player.position.z=nz;
}
document.querySelectorAll('[data-move]').forEach(b=>{const k=b.dataset.move;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);setMove(k,true)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>setMove(k,false)))});
const jumpBtn=document.getElementById('jumpBtn');function jump(){if(!buildMode&&grounded){jumpVelocity=5.4;grounded=false;hint.textContent='Jump!'}}jumpBtn.addEventListener('click',jump);
const sprintBtn=document.getElementById('sprintBtn');sprintBtn.addEventListener('pointerdown',e=>{e.preventDefault();sprinting=true;sprintBtn.classList.add('active');sprintBtn.textContent='RUNNING'});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>sprintBtn.addEventListener(ev,()=>{sprinting=false;sprintBtn.classList.remove('active');sprintBtn.textContent='RUN'}));
addEventListener('keydown',e=>{const map={ArrowUp:'forward',w:'forward',ArrowDown:'back',s:'back',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key])setMove(map[e.key],true);if(e.key==='Shift')sprinting=true;if(e.code==='Space'){e.preventDefault();jump()}});
addEventListener('keyup',e=>{const map={ArrowUp:'forward',w:'forward',ArrowDown:'back',s:'back',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key])setMove(map[e.key],false);if(e.key==='Shift')sprinting=false});

function furniture(type,x=0,z=0,rot=0){
 const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);
 const add=(w,h,d,m,px,py,pz)=>box(w,h,d,m,px,py,pz,g);
 if(type==='sofa'){add(2.5,.55,.9,fabric,0,.55,0);add(2.5,.9,.22,fabric,0,1.15,-.36);add(.22,.7,.9,fabric,-1.14,.9,0);add(.22,.7,.9,fabric,1.14,.9,0);for(let a of [-.9,.9])for(let b of [-.3,.3])add(.12,.35,.12,dark,a,.18,b)}
 if(type==='bed'){add(2.5,.35,3,wood,0,.35,0);add(2.35,.22,2.8,mat(0xe6e2d9),0,.62,.05);add(2.5,.85,.18,wood,0,.8,-1.45);add(.85,.22,.65,mat(0xf5f1e8),-.6,.85,-.8);add(.85,.22,.65,mat(0xf5f1e8),.6,.85,-.8)}
 if(type==='table'){add(1.7,.14,1.1,wood,0,.85,0);for(let x1 of [-.7,.7])for(let z1 of [-.4,.4])add(.12,.8,.12,dark,x1,.4,z1)}
 if(type==='plant'){add(.65,.55,.65,mat(0x9b5938),0,.28,0);for(let i=0;i<7;i++){let leaf=new THREE.Mesh(new THREE.SphereGeometry(.27,12,10),green);leaf.position.set(Math.sin(i)*.3,.9+Math.cos(i*2)*.15,Math.cos(i)*.3);leaf.scale.set(.65,1.5,.65);g.add(leaf)}}
 if(type==='lamp'){add(.12,1.8,.12,gold,0,.9,0);let shade=new THREE.Mesh(new THREE.ConeGeometry(.45,.45,20,1,true),gold);shade.position.y=1.95;g.add(shade);add(.6,.08,.6,dark,0,.05,0)}
 if(type==='tv'){add(2.1,1.2,.12,dark,0,1.5,0);add(1.95,1.05,.025,mat(0x101d2c,.2),0,1.5,.08);add(.12,.5,.12,dark,0,.65,0);add(1,.1,.5,wood,0,.3,0)}
 if(type==='kitchen'){add(3.2,.9,.72,wood,0,.48,0);add(3.3,.12,.82,mat(0xe8e5dc),0,1,0);add(1.15,.08,.65,dark,-.75,1.1,0);add(.72,.12,.55,dark,.9,1.1,0);add(.7,.75,.08,mat(0x9ba8ad),1.05,1.55,-.31);add(.16,.45,.16,gold,-.65,1.32,-.18)}
 if(type==='bath'){add(1.5,.28,2,mat(0xf0f0e9),-.8,.25,0);add(1.45,.12,1.9,mat(0x9fcbd5),-.8,.43,0);add(.65,.9,.65,mat(0xf4f2e9),.9,.45,-.35);add(.7,.12,.7,mat(0xe8e8e3),.9,.95,-.35);add(1.2,1.4,.08,windowMat,.9,1.8,-.72);add(.12,1.5,.12,gold,1.5,1.2,-.35)}
 if(type==='garage'){g.scale.setScalar(.68);add(3.5,.18,5,mat(0x777d83),0,.12,0);add(3.7,2.8,.18,mat(0xadb8bd),0,1.45,-2.5);add(3.35,2.25,.1,mat(0x667985),0,1.35,-2.38);for(let y=.45;y<2.5;y+=.45)add(3.35,.045,.12,mat(0xd4dadd),0,y,-2.3);add(.15,2.7,.15,wood,-1.8,1.4,-2.5);add(.15,2.7,.15,wood,1.8,1.4,-2.5)}

 items.push({type,g});last=g;return g;
}
function setMode(v){buildMode=v;modeLabel.textContent=v?'Build Mode':'Explore Mode';panel.classList.toggle('hidden',!v);document.getElementById('movePad').classList.toggle('hidden',v);hint.textContent=v?'Choose furniture, then tap the floor to place it':'Move with arrows • Hold RUN to sprint • Drag to look around';}
document.getElementById('build').onclick=()=>setMode(true);document.getElementById('explore').onclick=()=>setMode(false);
panel.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{selected=b.dataset.item;panel.querySelectorAll('[data-item]').forEach(x=>x.classList.toggle('active',x===b));hint.textContent='Selected '+selected+' • Tap floor to place'});
document.getElementById('rotate').onclick=()=>{rotation+=Math.PI/4;hint.textContent='Next furniture rotation: '+Math.round(rotation*180/Math.PI)+'°'};document.getElementById('door').onclick=()=>{const doors=[{d:Math.hypot(player.position.x+1.15,player.position.z+.7),fn:toggleDoor},{d:Math.hypot(player.position.x,player.position.z+2.8),fn:()=>innerRoomDoor.toggle()},{d:Math.hypot(player.position.x-1.95,player.position.z-2.55),fn:()=>garageDoor.toggle()}].sort((a,b)=>a.d-b.d);if(doors[0].d<=3.2)doors[0].fn();else hint.textContent='Darwaze de kol jao, phir Door button dabao'};
const roomControls=document.createElement('div');roomControls.innerHTML='<hr><h3>ROOM DOORS</h3><button id="innerDoorBtn">Kitchen / Bathroom Door</button><button id="garageDoorBtn">Garage Door</button>';panel.appendChild(roomControls);
document.getElementById('innerDoorBtn').onclick=()=>innerRoomDoor.toggle();document.getElementById('garageDoorBtn').onclick=()=>garageDoor.toggle();
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='e'&&!buildMode){if(Math.hypot(player.position.x,player.position.z+2.8)<3.2)innerRoomDoor.toggle();else if(Math.hypot(player.position.x-1.95,player.position.z-2.55)<3.2)garageDoor.toggle();else toggleDoor()}});
document.getElementById('delete').onclick=()=>{if(last){scene.remove(last);items=items.filter(i=>i.g!==last);last=items.length?items[items.length-1].g:null}};
document.getElementById('wall').onclick=()=>{const colors=[0xe4e1d9,0xd6e4e8,0xe7d7c6,0xc9d5c8,0xd8d0e6];wallColor=colors[(colors.indexOf(wallColor)+1)%colors.length];paintableWalls.forEach(o=>o.material.color.setHex(wallColor));};

document.getElementById('reset').onclick=()=>{items.forEach(i=>scene.remove(i.g));items=[];last=null;localStorage.removeItem('rhcraft-home');hint.textContent='Room reset'};
try{const saved=JSON.parse(localStorage.getItem('rhcraft-home')||'null');if(saved){if(saved.data)saved.data.forEach(i=>furniture(i.type,i.x,i.z,i.rot));if(saved.wallColor){wallColor=saved.wallColor;paintableWalls.forEach(o=>o.material.color.setHex(wallColor))}}}catch(e){}
function canPlaceFurniture(candidate){
 const bounds=new THREE.Box3().setFromObject(candidate);
 bounds.expandByScalar(.06);
 // Reject placements that intersect any room wall or partition.
 for(const wall of walls.children){
  const wallBounds=new THREE.Box3().setFromObject(wall);
  if(bounds.intersectsBox(wallBounds)) return false;
 }
 // Reject placements that overlap furniture already placed in the room.
 for(const item of items){
  if(item.g===candidate) continue;
  const otherBounds=new THREE.Box3().setFromObject(item.g);
  otherBounds.expandByScalar(.06);
  if(bounds.intersectsBox(otherBounds)) return false;
 }
 return true;
}
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{if(!buildMode)return;const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(pointer,camera);const hit=ray.intersectObject(floor);if(hit.length){const p=hit[0].point;if(Math.abs(p.x)<5&&p.z>-4.5&&p.z<4.5){const inside=selected==='garage'?p.x>2.1&&p.z>1.0:selected==='bath'?p.x>1.9&&p.z<-.9:selected==='kitchen'?p.x<-.9&&p.z<-.9:true;if(inside){const placed=furniture(selected,p.x,p.z,rotation);if(!canPlaceFurniture(placed)){scene.remove(placed);items=items.filter(i=>i.g!==placed);last=items.length?items[items.length-1].g:null;hint.textContent='Not placed: furniture nu wall ton door te hor furniture naal overlap ton bina rakho'}else hint.textContent=selected+' placed ✓'}else hint.textContent='Is room nu usde area vich place karo'}}});
let down=false,px=0,py=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.button!==0)return;down=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>down=false);renderer.domElement.addEventListener('pointercancel',()=>down=false);renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;yawTarget-=dx*.005;pitchTarget=Math.max(.10,Math.min(.82,pitchTarget+dy*.0035))});
const clock=new THREE.Clock();let runBlend=0;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);
 yaw=THREE.MathUtils.damp(yaw,yawTarget,12,dt);pitch=THREE.MathUtils.damp(pitch,pitchTarget,12,dt);
 let inputX=0,inputZ=0;if(!buildMode&&held.size){const forwardX=-Math.sin(yaw),forwardZ=-Math.cos(yaw),rightX=Math.cos(yaw),rightZ=-Math.sin(yaw);if(held.has('forward')){inputX+=forwardX;inputZ+=forwardZ}if(held.has('back')){inputX-=forwardX;inputZ-=forwardZ}if(held.has('left')){inputX-=rightX;inputZ-=rightZ}if(held.has('right')){inputX+=rightX;inputZ+=rightZ}}
 const inputLen=Math.hypot(inputX,inputZ);if(inputLen>0){const moveSpeed=sprinting?5.2:3.45;inputX=inputX/inputLen*moveSpeed;inputZ=inputZ/inputLen*moveSpeed;}const response=inputLen>0?13:9;playerVelocity.x=THREE.MathUtils.damp(playerVelocity.x,inputX,response,dt);playerVelocity.y=THREE.MathUtils.damp(playerVelocity.y,inputZ,response,dt);if(Math.abs(playerVelocity.x)<.015)playerVelocity.x=0;if(Math.abs(playerVelocity.y)<.015)playerVelocity.y=0;movePlayer(playerVelocity.x*dt,playerVelocity.y*dt);moving=Math.hypot(playerVelocity.x,playerVelocity.y)>.12;if(moving)player.rotation.y=THREE.MathUtils.damp(player.rotation.y,Math.atan2(playerVelocity.x,playerVelocity.y),14,dt);
 const running=moving&&sprinting,runTarget=running?1:0;
 runBlend=THREE.MathUtils.damp(runBlend,runTarget,8,dt);
 const cadence=10+runBlend*3.8,walkPhase=clock.elapsedTime*cadence;
 const legSwing=.62+runBlend*.27,armSwing=.38+runBlend*.3;
 legs.forEach((leg,i)=>{const swing=moving?Math.sin(walkPhase+(i*Math.PI))*legSwing:0;leg.rotation.x=THREE.MathUtils.damp(leg.rotation.x,swing, moving?18:12,dt)});
 arms.forEach((arm,i)=>{const swing=moving?Math.sin(walkPhase+(i===0?0:Math.PI))*armSwing:0;arm.rotation.x=THREE.MathUtils.damp(arm.rotation.x,swing, moving?18:12,dt)});
 // Gentle forward lean and stronger vertical bounce while sprinting.
 player.rotation.x=THREE.MathUtils.damp(player.rotation.x,running?.13:0,8,dt);
 const strideBounce=moving?Math.abs(Math.sin(walkPhase))*(.035+runBlend*.035):Math.sin(clock.elapsedTime*2)*.008;
 body.position.y=THREE.MathUtils.damp(body.position.y,.78+strideBounce,14,dt);
 head.position.y=THREE.MathUtils.damp(head.position.y,1.42+strideBounce*.65,14,dt);
 if(!grounded){
  player.position.y+=jumpVelocity*dt;jumpVelocity-=14*dt;
  if(player.position.y<=0){player.position.y=0;jumpVelocity=0;grounded=true;landingEffectTime=.34;landingRing.visible=true;landingRing.position.set(player.position.x,.025,player.position.z);landingRing.scale.setScalar(.65)}
 }
 // Air pose: tuck legs and lift arms; soften the body on take-off and landing.
 const airborne=!grounded, rising=airborne&&jumpVelocity>0;
 const bodyTargetY=airborne?.78+(rising?.10:-.035):landingEffectTime>0?.72:.78;
 body.scale.y=THREE.MathUtils.damp(body.scale.y,airborne?(rising?.94:1.04):landingEffectTime>0?1.12:1,airborne?10:18,dt);
 body.position.y=THREE.MathUtils.damp(body.position.y,bodyTargetY,airborne?12:18,dt);
 head.position.y=THREE.MathUtils.damp(head.position.y,airborne?1.48:1.42,12,dt);
 legs.forEach((leg,i)=>{if(airborne)leg.rotation.x=THREE.MathUtils.damp(leg.rotation.x,-.9,14,dt);else if(landingEffectTime>0)leg.rotation.x=THREE.MathUtils.damp(leg.rotation.x,.18,16,dt)});
 arms.forEach((arm,i)=>{if(airborne)arm.rotation.x=THREE.MathUtils.damp(arm.rotation.x,i===0?-.8:-.8,12,dt);else if(landingEffectTime>0)arm.rotation.x=THREE.MathUtils.damp(arm.rotation.x,i===0?.35:-.35,16,dt)});
 jumpShadow.position.set(player.position.x,.012,player.position.z);const shadowScale=1+player.position.y*.32;jumpShadow.scale.set(shadowScale,shadowScale,1);jumpShadow.material.opacity=Math.max(.08,.28-player.position.y*.07);
 if(landingEffectTime>0){landingEffectTime=Math.max(0,landingEffectTime-dt);const progress=1-landingEffectTime/.34;landingRing.scale.setScalar(.65+progress*2.2);landingRing.material.opacity=(1-progress)*.48;if(landingEffectTime===0){landingRing.visible=false;hint.textContent='Landed ✓'}}
 if(!buildMode)target.lerp(new THREE.Vector3(player.position.x,1.05+player.position.y,player.position.z),1-Math.exp(-7*dt));
 camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*distance,target.y+Math.sin(pitch)*distance,target.z+Math.cos(yaw)*Math.cos(pitch)*distance);camera.lookAt(target);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
